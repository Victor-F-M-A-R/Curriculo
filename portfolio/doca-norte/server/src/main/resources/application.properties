server.port=${PORT:8081}
server.address=${BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./data/yard;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.maximum-pool-size=8
spring.jdbc.template.query-timeout=3s
spring.sql.init.mode=always
server.error.include-message=never
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
yard.reader-token=${YARD_READER_TOKEN:}
yard.auth-max-age-seconds=${OIDC_MAX_AUTH_AGE_SECONDS:300}
