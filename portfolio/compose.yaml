name: caderno-aplicado
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo-local-apenas}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 3s
      timeout: 3s
      retries: 30
  doca:
    build: ./doca-norte
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8081:8081"]
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/portfolio
      DB_USER: portfolio
      DB_PASSWORD: ${POSTGRES_PASSWORD:-demo-local-apenas}
  portaria:
    build: ./doca-norte/portaria
    depends_on: [doca]
    ports: ["127.0.0.1:8085:8085"]
    environment:
      YARD_ORIGIN: http://doca:8081
  lastro:
    build: ./lastro
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:8082:8082"]
    environment:
      BOOK_ENGINE: postgres
      BOOK_CONNECTION: Host=postgres;Database=portfolio;Username=portfolio;Password=${POSTGRES_PASSWORD:-demo-local-apenas}
      COSMOS_CONNECTION: ${COSMOS_CONNECTION:-}
    volumes: [lastro-keys:/home/app/.aspnet/DataProtection-Keys]
  farol:
    build: ./farol
    ports: ["127.0.0.1:8083:8083"]
    volumes: [farol-data:/data]
    environment:
      REVIEW_WEBHOOK_URL: ${REVIEW_WEBHOOK_URL:-}
      REVIEW_WEBHOOK_TOKEN: ${REVIEW_WEBHOOK_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
  inbox:
    profiles: [automation]
    build: ./farol/inbox
    environment:
      INBOX_TOKEN: ${INBOX_TOKEN:-demo-local-inbox}
    volumes: [inbox-data:/data]
  n8n:
    profiles: [automation]
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.48.5}
    ports: ["127.0.0.1:5678:5678"]
    volumes: [n8n-data:/home/node/.n8n]
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
volumes:
  pg:
  lastro-keys:
  farol-data:
  inbox-data:
  n8n-data:
