name: Verificar produtos
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    working-directory: portfolio
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: portfolio_test
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 3s --health-timeout 3s --health-retries 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Compilar interfaces
        run: |
          for app in doca-norte lastro farol; do (cd "$app/web" && npm ci --ignore-scripts && npm run build); done
      - name: Testar H2, SQLite e compilar o receptor de revisão
        run: |
          mvn -B -ntp -f doca-norte/server/pom.xml package
          mvn -B -ntp -f doca-norte/portaria/pom.xml package
          dotnet test lastro/tests -c Release
          dotnet test farol/inbox/tests -c Release
          python farol/inbox/tests/test_http.py
      - name: Verificar busca, respostas e recusas do Farol
        run: |
          python -m pip install --only-binary=:all: -r farol/service/requirements.txt -r rastro/requirements.txt
          mkdir -p .artifacts
          (cd farol/service && python -m unittest -v)
          python farol/service/evaluate.py --output .artifacts/farol-retrieval.json
          python farol/service/evaluate.py --suite content --output .artifacts/farol-content.json
          python - <<'PY'
          import json
          from pathlib import Path
          retrieval = json.loads(Path('.artifacts/farol-retrieval.json').read_text())
          content = json.loads(Path('.artifacts/farol-content.json').read_text())
          assert retrieval['correct_cited_answers'] == retrieval['answerable'], retrieval
          assert retrieval['correct_abstentions'] == retrieval['unanswerable'], retrieval
          assert content['passed'] == content['cases'], content
          PY
      - name: Repetir testes de persistência com PostgreSQL
        env:
          TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/portfolio_test
          TEST_DB_USER: portfolio
          TEST_DB_PASSWORD: local-ci-only
          TEST_BOOK_ENGINE: postgres
          TEST_BOOK_CONNECTION: Host=127.0.0.1;Database=portfolio_test;Username=portfolio;Password=local-ci-only
        run: |
          mvn -B -ntp -f doca-norte/server/pom.xml test
          dotnet test lastro/tests -c Release --no-build
      - name: Testar ingestão HTTP e transações do Rastro com PostgreSQL
        env:
          RASTRO_DATABASE_URL: host=127.0.0.1 port=5432 dbname=portfolio_test user=portfolio
          PGPASSWORD: local-ci-only
        run: |
          cd rastro
          python -m unittest discover -s tests -v
      - name: Preparar o navegador de testes
        timeout-minutes: 12
        run: |
          (cd tests && npm ci --ignore-scripts)
          # Reuse the runner browser to avoid an unrelated apt mirror blocking the test suite.
          browser=$(command -v google-chrome || command -v google-chrome-stable || true)
          if [ -n "$browser" ]; then
            "$browser" --version
            echo "CHROMIUM_PATH=$browser" >> "$GITHUB_ENV"
          else
            (cd tests && npx playwright install --only-shell chromium)
          fi
          (cd tests && npx playwright install --with-deps firefox webkit)
      - name: Exercitar fluxos e acessibilidade em três motores
        env:
          PGPASSWORD: local-ci-only
        run: |
          for browser in chromium firefox webkit; do
            database="portfolio_browser_$browser"
            docker exec '${{ job.services.postgres.id }}' createdb -U portfolio "$database"
            export RASTRO_DATABASE_URL="host=127.0.0.1 port=5432 dbname=$database user=portfolio"
            export PW_BROWSER="$browser"
            export PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report-$browser"
            export PLAYWRIGHT_JSON_OUTPUT_NAME="$PWD/.artifacts/browser-$browser/results.json"
            bash tests/run-local.sh
            mkdir -p ".artifacts/browser-$browser"
            cp -R tests/test-results/. ".artifacts/browser-$browser/"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: farol-evaluations, path: portfolio/.artifacts/farol-*.json, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: browser-evidence, path: 'portfolio/.artifacts/browser-*', if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: traces, path: portfolio/tests/test-results, if-no-files-found: ignore }
  field:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.0', channel: stable, cache: true }
      - working-directory: portfolio/doca-norte/field
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build web --release --dart-define=YARD_API=https://yard.example
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      COMPOSE_PARALLEL_LIMIT: '1'
      COMPOSE_PROJECT_NAME: portfolio-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Compilar as imagens em sequência
        run: |
          set -euo pipefail
          for service in doca portaria lastro farol rastro inbox; do
            for attempt in 1 2 3; do
              if docker compose -f compose.yaml -f compose.automation.yaml --profile automation build "$service" 2>&1 | tee "/tmp/portfolio-build-$service.log"; then break; fi
              # Respect registry throttling; do not retry compilation or test failures.
              if [ "$attempt" = 3 ] || ! grep -q '429\|Too Many Requests' "/tmp/portfolio-build-$service.log"; then exit 1; fi
              sleep "$((30 * attempt))"
            done
          done
      - name: Iniciar os quatro produtos e o workflow local
        run: docker compose -f compose.yaml -f compose.automation.yaml --profile automation up -d --no-build
      - name: Verificar operações, entrega real, autenticação e reenvio
        run: python tests/compose_verify.py
      - name: Interromper serviços, reiniciar e conferir recuperação e persistência
        timeout-minutes: 9
        run: python tests/resilience_verify.py
      - name: Mostrar diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.automation.yaml --profile automation ps -a
          docker compose -f compose.yaml -f compose.automation.yaml --profile automation logs --no-color --tail 100
      - name: Encerrar o projeto descartável do runner
        if: always()
        run: docker compose -f compose.yaml -f compose.automation.yaml --profile automation down --volumes --remove-orphans
