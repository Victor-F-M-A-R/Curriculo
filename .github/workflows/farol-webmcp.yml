name: Farol WebMCP
on:
  push:
    branches: ['feat/farol-webmcp']
  pull_request:
    paths: ['portfolio/farol/**', 'portfolio/tests/webmcp/**', 'portfolio/tests/webmcp.config.mjs', '.github/workflows/farol-webmcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol-and-sessions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --only-binary=:all: -r portfolio/farol/service/requirements.txt
      - run: npm ci --ignore-scripts && npm run build
        working-directory: portfolio/farol/web
      - run: python -m unittest -q
        working-directory: portfolio/farol/service
      - run: npm ci --ignore-scripts && npx playwright install --with-deps chromium
        working-directory: portfolio/tests
      - run: npx playwright test --config webmcp.config.mjs
        working-directory: portfolio/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: farol-webmcp-evidence
          path: portfolio/tests/test-results/
