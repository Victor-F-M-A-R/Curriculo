name: Verificar aplicativo em Android e iOS
on:
  push:
    paths: ['portfolio/doca-norte/field/**', '.github/workflows/field-native.yml']
  pull_request:
    paths: ['portfolio/doca-norte/field/**', '.github/workflows/field-native.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: portfolio/doca-norte/field
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.0', channel: stable, cache: true }
      - name: Preparar emulador Android descartável
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/portfolio-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n portfolio_qa -p "$ANDROID_AVD_HOME/portfolio_qa.avd" -k 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x portfolio_qa
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd portfolio_qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -cores 2 -memory 2048 > emulator.log 2>&1 &
          emulator_pid=$!
          for attempt in {1..120}; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then tail -60 emulator.log; exit 1; fi
            if [ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 3
          done
          test "$(adb -s emulator-5554 shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb -s emulator-5554 shell input keyevent 82
      - name: Executar plugins reais e cenários de navegação
        run: |
          flutter pub get
          flutter test integration_test/native_notes_test.dart -d emulator-5554 --reporter expanded
          adb -s emulator-5554 exec-out screencap -p > android-final.png
      - name: Coletar diagnóstico Android
        if: always()
        run: adb -s emulator-5554 logcat -d -t 1000 > android-logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-android
          path: |
            portfolio/doca-norte/field/pubspec.lock
            portfolio/doca-norte/field/emulator.log
            portfolio/doca-norte/field/android-logcat.txt
            portfolio/doca-norte/field/android-final.png
      - name: Encerrar emulador
        if: always()
        run: adb -s emulator-5554 emu kill || true
  ios:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.50.0', channel: stable, cache: true }
      - name: Preparar simulador iOS descartável
        timeout-minutes: 5
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"] and x["isAvailable"]))')
          echo "IOS_QA_DEVICE=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
      - name: Executar Keychain real e cenários de navegação
        timeout-minutes: 20
        run: |
          set -euo pipefail
          flutter pub get
          flutter test integration_test/native_notes_test.dart -d "$IOS_QA_DEVICE" --reporter expanded --verbose 2>&1 | tee ios-integration.log
      - name: Coletar diagnóstico iOS
        if: always()
        timeout-minutes: 2
        run: |
          xcrun simctl list devices available > ios-devices.txt
          if [ -n "${IOS_QA_DEVICE:-}" ]; then
            xcrun simctl io "$IOS_QA_DEVICE" screenshot ios-final.png || true
            xcrun simctl spawn "$IOS_QA_DEVICE" log show --last 20m --style compact --predicate 'process == "Runner" OR eventMessage CONTAINS[c] "dev.docanorte.docaField"' > ios-simulator.log 2>&1 || true
          fi
          mkdir -p ios-crashes
          shopt -s nullglob
          for report in "$HOME"/Library/Logs/DiagnosticReports/Runner*.ips "$HOME"/Library/Logs/DiagnosticReports/Runner*.crash; do
            cp "$report" ios-crashes/
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-ios
          path: |
            portfolio/doca-norte/field/pubspec.lock
            portfolio/doca-norte/field/ios/Podfile.lock
            portfolio/doca-norte/field/ios-final.png
            portfolio/doca-norte/field/ios-integration.log
            portfolio/doca-norte/field/ios-simulator.log
            portfolio/doca-norte/field/ios-devices.txt
            portfolio/doca-norte/field/ios-crashes/
      - name: Encerrar simulador
        if: always()
        run: xcrun simctl shutdown "$IOS_QA_DEVICE" || true
